# CI v3 — BiblioAPI (RM7). Mede app e mcp_server. O teste de injection entra no pytest.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Ruff
        run: ruff check .

      - name: Pytest (CI v3 — BDD + cov app e mcp_server ≥70%)
        run: pytest -q --cov=app --cov=mcp_server --cov-fail-under=70

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
